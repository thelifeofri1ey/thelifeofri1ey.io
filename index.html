<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A clean, minimalist personal blog template built with semantic HTML and CSS.">
  <title>The Life of Riley</title>
    <link rel="icon" type="image/png" href="/images/rainbowemoji">
  <style>
    :root {
      --bg-color: #000000;
      --text-color: #ffffff;
      --muted-color: #6b7280;
      --accent-color: #2563eb;
      --border-color: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      color: var(--text-color);
      background-color: var(--bg-color);
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Header & Navigation */
    header {
      border-bottom: 1px solid var(--border-color);
      padding: 2rem 0;
      margin-bottom: 3rem;
    }

    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .site-title {
      font-size: 1.5rem;
      font-weight: 700;
      text-decoration: none;
      color: var(--text-color);
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 1.5rem;
    }

    nav a {
      text-decoration: none;
      color: var(--muted-color);
      font-weight: 500;
    }

    nav a:hover {
      color: var(--accent-color);
    }

    /* Blog Post List */
    main {
      display: flex;
      flex-direction: column;
      gap: 3rem;
    }

    article {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 2.5rem;
    }

    article:last-of-type {
      border-bottom: none;
    }

    .post-meta {
      font-size: 0.875rem;
      color: var(--muted-color);
      margin-bottom: 0.5rem;
    }

    .post-title {
      font-size: 1.75rem;
      margin-bottom: 0.75rem;
      line-height: 1.3;
    }

    .post-title a {
      text-decoration: none;
      color: var(--text-color);
    }

    .post-title a:hover {
      color: var(--accent-color);
    }

    .post-excerpt {
      margin-bottom: 1rem;
      color: #374151;
    }

    .read-more {
      font-weight: 600;
      text-decoration: none;
      color: var(--accent-color);
    }

    .read-more:hover {
      text-decoration: underline;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border-color);
      margin-top: 4rem;
      padding: 2rem 0;
      text-align: center;
      font-size: 0.875rem;
      color: var(--muted-color);
    }
  </style>
</head>
<body>

  <header>
    <div class="container header-inner">
<h1><center><i>Namaste, Bitches.</i></center></h1>      
      
      <nav aria-label="Primary Navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#archive">Archive</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <article>
      <div class="post-meta">
        <time datetime="2026-11-15">November 15, 2026</time> &middot; <span>4 min read</span>
      </div>
      <h2 class="post-title"><a href="post-2.html">Getting Started</a></h2>
      <p class="post-excerpt">
Zzzz..      </p>
      <a href="post-2.html" class="read-more">Read full post &rarr;</a>
    </article>

    <article>
      <div class="post-meta">
        <time datetime="2026-11-17">November 17, 2026</time> &middot; <span>6 min read</span>
      </div>
      <h2 class="post-title"><a href="post-1.html">Genesis</a></h2>
      <p class="post-excerpt">
And on the first day, God spoke and said "Let there be content"...      </p>
      <a href="post-1.html" class="read-more">full post &rarr;</a>
    </article>
  </main>

  <footer>
    <div class="container">
      <p>&copy; R. Gould 2026. Built with clean HTML &amp; CSS.</p>
    </div>
  </footer>

</body>
</html>
